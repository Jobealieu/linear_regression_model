[project]
name = "entropy"
version = "0.1.0"
description = "ENTROPY: predicting the all-in cost of sending money to Africa (World Bank Remittance Prices Worldwide)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
]
